<div class="standings-widget">
  <div class="widget-header">
    <div class="header-left">
      <i class="fa-solid fa-trophy"></i>
      <h3>Championship Standings</h3>
    </div>
    <a routerLink="/standings" class="view-all-link">
      View Full <i class="fa-solid fa-arrow-right"></i>
    </a>
  </div>

  <div class="tabs">
    <button 
      class="tab-btn" 
      [class.active]="activeTab === 'drivers'"
      (click)="setActiveTab('drivers')">
      <i class="fa-solid fa-helmet-safety"></i>
      Drivers
    </button>
    <button 
      class="tab-btn" 
      [class.active]="activeTab === 'constructors'"
      (click)="setActiveTab('constructors')">
      <i class="fa-solid fa-flag"></i>
      Constructors
    </button>
  </div>

  <div class="standings-content" *ngIf="activeTab === 'drivers'">
    <div class="standing-item" *ngFor="let driver of driverStandings">
      <div class="position-badge" [class.top-3]="driver.position <= 3">
        {{ driver.position }}
      </div>
      <div class="driver-info">
        <span class="driver-name">{{ driver.driverName }}</span>
        <span class="team-name" [style.color]="getTeamColor(driver.teamName)">
          {{ driver.teamName }}
        </span>
      </div>
      <div class="points-stats">
        <span class="points">{{ driver.points }}</span>
        <span class="wins" *ngIf="driver.wins > 0">
          <i class="fa-solid fa-crown"></i> {{ driver.wins }}
        </span>
      </div>
    </div>
  </div>

  <div class="standings-content" *ngIf="activeTab === 'constructors'">
    <div class="standing-item" *ngFor="let team of constructorStandings">
      <div class="position-badge" [class.top-3]="team.position <= 3">
        {{ team.position }}
      </div>
      <div class="team-info">
        <span class="team-name" [style.color]="getTeamColor(team.teamName)">
          {{ team.teamName }}
        </span>
      </div>
      <div class="points-stats">
        <span class="points">{{ team.points }}</span>
        <span class="wins" *ngIf="team.wins > 0">
          <i class="fa-solid fa-trophy"></i> {{ team.wins }}
        </span>
      </div>
    </div>
  </div>

  <div class="standings-footer">
    <span class="next-race-info">
      <i class="fa-regular fa-clock"></i>
      Next race: Abu Dhabi GP
    </span>
  </div>
</div>
