services:
  db:
    image: postgres:16.11-alpine
    container_name: db
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${DATABASE_PORT}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env.prod

  web:
    image: fastlap
    container_name: web
    ports:
      - "8000:8000"
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENV_FILE=.env.prod
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    secrets:
      - fastlap_firebase_credentials

volumes:
  postgres_data:

secrets:
  fastlap_firebase_credentials:
    file: secrets/firebase-credentials.json

