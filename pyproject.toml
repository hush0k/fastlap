[project]
requires-python = ">=3.12"
name = "fastlap"
version = "1.0"
dependencies = [
    "daphne>=4.2.1",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "django", "first-party", "local-folder"]
sections = {"django" = ["django", "rest_framework", "django_ratelimit"]}
known-first-party = ["apps", "settings", "common"]
